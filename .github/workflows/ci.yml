name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fastest checks first: no point running tests on code that does not compile
  quality:
    name: Type check, lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # Base of the pyramid: many fast tests on pure business rules
  unit:
    name: Unit tests + coverage
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests own the business rules, so their coverage is measured on src/domain only
      - run: npm run test:unit:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
            console.log(['### Unit test coverage (src/domain)','| Metric | % | Covered |', '|---|---|---|',
              ...['lines', 'branches', 'functions', 'statements'].map(row)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: coverage/
          retention-days: 14

  # Middle of the pyramid: real HTTP requests against the app wired to a real PostgreSQL (PGlite)
  integration:
    name: Integration tests (API + PostgreSQL)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs every layer so the coverage thresholds apply to the whole codebase
      - run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
            console.log(['### Total coverage (unit + integration)', '| Metric | % | Covered |', '|---|---|---|',
              ...['lines', 'branches', 'functions', 'statements'].map(row)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            coverage/
            test-results/
          retention-days: 14
