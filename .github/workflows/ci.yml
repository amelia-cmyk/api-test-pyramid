name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fastest checks first: no point running tests on code that does not compile
  quality:
    name: Type check, lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # Base of the pyramid: many fast tests on pure business rules
  unit:
    name: Unit tests + coverage
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests own the business rules, so their coverage is measured on src/domain only
      - run: npm run test:unit:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
            console.log(['### Unit test coverage (src/domain)','| Metric | % | Covered |', '|---|---|---|',
              ...['lines', 'branches', 'functions', 'statements'].map(row)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: coverage/
          retention-days: 14

  # Middle of the pyramid: real HTTP requests against the app wired to a real PostgreSQL (PGlite)
  integration:
    name: Integration tests (API + PostgreSQL)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit + integration together, so the coverage thresholds apply to the whole codebase
      - run: npx vitest run --project unit --project integration --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
            console.log(['### Total coverage (unit + integration)', '| Metric | % | Covered |', '|---|---|---|',
              ...['lines', 'branches', 'functions', 'statements'].map(row)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            coverage/
            test-results/
          retention-days: 14

  # Contract: the consumer writes the pact, then the real provider must honour it.
  # (In a multi-repo setup the pact would go through a Pact Broker and `can-i-deploy` would gate releases.)
  contract:
    name: Contract tests (Pact)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consumer - write the contract
        run: npm run test:contract:consumer
      - name: Provider - verify the real API against the contract
        run: npm run test:contract:provider
      - name: Contract summary
        if: always()
        run: |
          node -e "
            const p = require('./pacts/LibraryMobileApp-LibraryAPI.json');
            console.log(['### Contract: ' + p.consumer.name + ' → ' + p.provider.name,
              '| Provider state | Request | Expected status |', '|---|---|---|',
              ...p.interactions.map(i => '| ' + i.providerStates[0].name + ' | ' + i.request.method + ' ' + i.request.path + ' | ' + i.response.status + ' |')
            ].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-contract
          path: pacts/
          retention-days: 14

  # Top of the pyramid: many virtual users at once; latency and error-rate thresholds gate the build
  performance:
    name: Performance tests (k6)
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.4.0'
      - name: Start the API
        run: |
          PORT=3000 npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "API did not start"; cat api.log; exit 1
      - name: Load test (ramps up to 20 virtual users)
        run: k6 run perf/library-load.js
      - name: Performance summary
        if: always()
        run: cat k6-summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No k6 summary produced" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: |
            k6-summary.json
            api.log
          retention-days: 14
